name: solutionarchitectai
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    environment: &backend-environment
      SAA_MODE: production
      SAA_SERVER__HOST: ${SAA_SERVER__HOST:-0.0.0.0}
      SAA_SERVER__PORT: ${SAA_SERVER__PORT:-8000}
      SAA_DATABASE__CREDENTIALS__PASSWORD: ${SAA_DATABASE__CREDENTIALS__PASSWORD:-local-development-only}
      SAA_LLM__BASE_URL: ${SAA_LLM__BASE_URL:-http://fake-llm:8000/v1}
      SAA_LLM__MODEL: ${SAA_LLM__MODEL:-fake-chat}
      SAA_LLM__API_KEY: ${SAA_LLM__API_KEY:-local-no-external-key}
      SAA_LLM__CONTEXT_WINDOW:
      SAA_LLM__OUTPUT_LIMIT:
      SAA_LLM__CONCURRENCY:
      SAA_LLM__TEMPERATURE:
      SAA_LLM__STRUCTURED_MODE:
      SAA_LLM__SERVICE_TOKENS:
      SAA_LLM__APPROXIMATE_CHARS_PER_TOKEN:
      SAA_LLM__RETRY__NETWORK_RETRIES:
      SAA_LLM__RETRY__VALIDATION_RETRIES:
      SAA_LLM__RETRY__MAX_TOTAL_REQUESTS:
      SAA_LLM__RETRY__DEADLINE_SECONDS:
      SAA_LLM__RETRY__REQUEST_TIMEOUT_SECONDS:
      SAA_LLM__RETRY__BACKOFF_INITIAL:
      SAA_LLM__RETRY__BACKOFF_MAX:
      SAA_LLM__RETRY__JITTER:
    volumes: &backend-volumes
      - git-data:/data/git
      - file-data:/data/files
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${COMPOSE_BACKEND_PORT:-8000}:${SAA_SERVER__PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['SAA_SERVER__PORT'] + '/api/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    networks: [default, rendering]
    stop_grace_period: 20s
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    environment: *backend-environment
    volumes: *backend-volumes
    command: ["python", "-m", "solution_architect_ai.di.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FRONTEND_PORT: ${COMPOSE_FRONTEND_LISTEN_PORT:-8080}
      BACKEND_PORT: ${SAA_SERVER__PORT:-8000}
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${COMPOSE_FRONTEND_PORT:-8080}:${COMPOSE_FRONTEND_LISTEN_PORT:-8080}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${FRONTEND_PORT}/"]
      interval: 5s
      timeout: 3s
      retries: 10
  plantuml:
    image: plantuml/plantuml-server:jetty@sha256:3719f4a9b0b061f1aa42d14d130388f831954ca65685d521b6c5b72301e993e6
    environment:
      PLANTUML_SECURITY_PROFILE: SANDBOX
      JAVA_OPTIONS: -Xmx256m
    networks: [rendering]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: solution_architect
      POSTGRES_USER: solution_architect
      POSTGRES_PASSWORD: ${SAA_DATABASE__CREDENTIALS__PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${COMPOSE_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solution_architect -d solution_architect"]
      interval: 3s
      timeout: 3s
      retries: 20
  fake-llm:
    build:
      context: .
      dockerfile: tools/fake_llm/Dockerfile
    ports:
      - "${COMPOSE_BIND_HOST:-127.0.0.1}:${COMPOSE_FAKE_LLM_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  git-data:
  file-data:
networks:
  rendering:
    internal: true
