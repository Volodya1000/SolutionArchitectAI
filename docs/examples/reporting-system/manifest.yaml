система: Система формирования отчётности
контекст:
  контур: Внутренний тестовый
  критичность: Обычная
  класс_данных: Продажи и сводка — конфиденциальные финансовые данные без персональных сведений
  пользователи: Сотрудники с ролью «Аналитик»
  профиль_обслуживания: Внутренний сервис в рабочие дни 08:00–18:00; не клиентское приложение 24/7
  выбранный_прокси: технологический_прокси
  статус_модели: Черновик; исходные требования содержат открытые вопросы A-01 и A-07
  редакция_источников: Полный Git commit hash содержащего комплект снимка; определяется из истории Git
  идентификация_редакции: Документ определяется путём и полным hash коммита; коммит не означает согласования
  контроль_качества_по_умолчанию:
    область: Все объекты и связи данного ручного эталона; явная запись объекта уточняет это состояние
    статус: Требует проверки
    основание: Источники и основания перечислены; трактовка и решения ещё ожидают проверки архитектором
    правило_смены: FR-09 (происхождение и качество); при изменении источника зависимые подтверждения проверяются заново
  правила:
    SEC-01: Все соединения защищены TLS; протоколы и порты заданы каталогом
    SEC-02: Проверка доступа при каждом пользовательском запросе
    SEC-03: Минимальные права; сессии и отчёты не записываются в журналы
    SEC-04: Только назначенный получатель, защищённый канал и клиентский сертификат
    SEC-05: 2FA при доступе пользователя к персональным, клиентским и иным данным
    SEC-06: Любой внешний запрос и передача данных только через корпоративный прокси
    SEC-07: Клиентское приложение 24/7 — отказоустойчивый бизнес-прокси; остальные — технологический
    SEC-08: Чувствительные внешние данные шифруются либо передаются по IPsec; финансовая сводка защищается
      TLS
    ARCH-01: Переиспользование корпоративных активов
    ARCH-02: Разделение загрузки и обслуживания запросов
    VIEW-01: 'ArchiMate: Component, Data Object, Flow, Access; System Software и направленная Association
      в техническом срезе'
  обязательность_правил: Все правила обязательны, исключений нет
