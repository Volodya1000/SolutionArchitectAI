система: Система формирования отчётности
контекст:
  контур: Внутренний тестовый
  критичность: Обычная
  класс_данных: Продажи и сводка — конфиденциальные финансовые данные без персональных сведений
  пользователи: Сотрудники с ролью «Аналитик»
системы:
  система_продаж:
    название: Система продаж
    назначение: Публикует завершённые продажи в брокер сообщений
    тип: Система
    состояние: Существует
  система_подразделений:
    название: Система учёта подразделений
    назначение: Предоставляет коды и наименования подразделений
    тип: Система
    состояние: Существует
  корпоративный_доступ:
    название: Система корпоративного доступа
    назначение: Проверяет права сотрудника на получение отчёта
    тип: Система
    состояние: Существует
  брокер_сообщений:
    название: Корпоративный брокер сообщений
    назначение: Передаёт события продаж через Apache Kafka
    тип: Брокер сообщений
    состояние: Существует
  загрузчик:
    название: Сервис загрузки данных
    назначение: Проверяет и сохраняет продажи, обновляет справочник по расписанию
    тип: Сервис
    состояние: Создаётся
  сервис_отчетности:
    название: Сервис формирования отчётности
    назначение: Объединяет данные, подсчитывает итоги и выдаёт сводку или CSV
    тип: Сервис
    состояние: Создаётся
  база_отчетности:
    название: База данных отчётности
    назначение: Хранит данные в готовой платформе PostgreSQL
    тип: База данных
    состояние: Создаётся
    платформа: платформа_postgresql
  браузер:
    название: Браузер сотрудника
    назначение: Показывает сводку, CSV и состояние загрузки
    тип: Пользовательское приложение
    состояние: Существует
  платформа_postgresql:
    название: Платформа PostgreSQL
    назначение: Предоставляет инфраструктуру для создаваемой логической базы
    тип: Инфраструктурная платформа
    состояние: Существует
  передача_отчетов:
    название: Система передачи отчётов
    назначение: Передаёт CSV внешнему получателю по выбранному защищённому каналу
    тип: Система
    состояние: Существует
  внешний_получатель:
    название: Внешняя система-получатель
    назначение: Принимает согласованную сводку и возвращает подтверждение
    тип: Внешняя система
    состояние: Существует
данные:
  продажи:
    название: Данные о продажах
    описание: Неизменяемые завершённые продажи из системы продаж
    состав:
    - Уникальный номер продажи
    - Дата продажи
    - Код подразделения
    - Сумма
  справочник_подразделений:
    название: Справочник подразделений
    описание: Коды и названия подразделений, используемые для расшифровки продаж
    состав:
    - Код подразделения
    - Наименование подразделения
  отчетные_данные:
    название: Данные отчётности
    описание: Продажи, справочник и состояние загрузки, сохранённые в БД
    хранение: база_отчетности
    срок_хранения_продаж: 30 календарных дней
  сводный_отчет:
    название: Сводный отчёт
    описание: Количество продаж и общая сумма по подразделениям за выбранный день
    состав:
    - Дата
    - Подразделение
    - Количество продаж
    - Сумма
    хранение: Не сохраняется
    классификация: Конфиденциальные финансовые данные
  состояние_загрузки:
    название: Состояние загрузки
    описание: Состояние обработчика и время последней успешной обработки
    хранение: база_отчетности
  права_доступа:
    название: Результат проверки доступа
    описание: Разрешение на запрос и подтверждённая роль сотрудника
    хранение: Не сохраняется
  подтверждение_передачи:
    название: Подтверждение передачи
    описание: Результат приёма внешним получателем и номер подтверждения
    хранение: Не сохраняется
потоки:
  публикация_продаж:
    откуда: система_продаж
    куда: брокер_сообщений
    данные:
    - продажи
    когда: После завершения продажи
    взаимодействие: публикация_в_брокер
  получение_продаж:
    откуда: брокер_сообщений
    куда: загрузчик
    данные:
    - продажи
    когда: В течение дня
    взаимодействие: чтение_из_брокера
  получение_справочника:
    откуда: система_подразделений
    куда: загрузчик
    данные:
    - справочник_подразделений
    когда: При запуске и ежедневно в 06:00
    взаимодействие: запрос_справочника
  сохранение_данных:
    откуда: загрузчик
    куда: отчетные_данные
    данные:
    - отчетные_данные
    когда: После проверки входных данных
    взаимодействие: запись_в_базу
  чтение_данных:
    откуда: отчетные_данные
    куда: сервис_отчетности
    данные:
    - отчетные_данные
    когда: При пользовательском запросе
    взаимодействие: чтение_базы
  проверка_доступа:
    откуда: корпоративный_доступ
    куда: сервис_отчетности
    данные:
    - права_доступа
    когда: При каждом пользовательском запросе
    взаимодействие: запрос_прав
  выдача_сводки:
    откуда: сервис_отчетности
    куда: браузер
    данные:
    - сводный_отчет
    - состояние_загрузки
    - подтверждение_передачи
    когда: После проверки доступа
    взаимодействие: пользовательский_запрос
  передача_отчета:
    откуда: сервис_отчетности
    куда: передача_отчетов
    данные:
    - сводный_отчет
    когда: По команде аналитика
    взаимодействие: защищенная_передача
  доставка_получателю:
    откуда: передача_отчетов
    куда: внешний_получатель
    данные:
    - сводный_отчет
    когда: После проверки разрешённого получателя
    взаимодействие: доставка_отчета
взаимодействия:
  публикация_в_брокер:
    инициатор: система_продаж
    получатель: брокер_сообщений
    назначение: Публикация новых продаж
    протокол: Kafka поверх TLS
    порт: 9093
    доступ: Запись в поток продаж
  чтение_из_брокера:
    инициатор: загрузчик
    получатель: брокер_сообщений
    назначение: Чтение продаж; подтверждение после сохранения в БД
    протокол: Kafka поверх TLS
    порт: 9093
    доступ: Чтение потока продаж
  запрос_справочника:
    инициатор: загрузчик
    получатель: система_подразделений
    назначение: Получение справочника подразделений
    протокол: HTTPS
    порт: 443
    доступ: Только чтение
  запись_в_базу:
    инициатор: загрузчик
    получатель: база_отчетности
    назначение: Проверка повторов, сохранение данных и состояния загрузки
    протокол: PostgreSQL поверх TLS
    порт: 5432
    доступ: Чтение и запись
  чтение_базы:
    инициатор: сервис_отчетности
    получатель: база_отчетности
    назначение: Чтение данных для сводки и состояния загрузки
    протокол: PostgreSQL поверх TLS
    порт: 5432
    доступ: Только чтение
  запрос_прав:
    инициатор: сервис_отчетности
    получатель: корпоративный_доступ
    назначение: Проверка прав сотрудника
    протокол: HTTPS
    порт: 443
  пользовательский_запрос:
    инициатор: браузер
    получатель: сервис_отчетности
    назначение: Просмотр сводки, скачивание CSV, передача внешнему получателю и получение состояния
    протокол: HTTPS
    порт: 443
  защищенная_передача:
    инициатор: сервис_отчетности
    получатель: передача_отчетов
    назначение: Передача CSV и получение подтверждения внешнего приёма
    протокол: HTTPS
    порт: 443
    канал: Защищённая передача
    защита: Клиентский сертификат и проверка разрешённого получателя
  доставка_отчета:
    инициатор: передача_отчетов
    получатель: внешний_получатель
    назначение: Доставка отчёта и получение подтверждения приёма
    протокол: HTTPS
    порт: 443
    защита: Согласованный защищённый интерфейс, клиентский сертификат
