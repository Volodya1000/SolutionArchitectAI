система: Система формирования отчётности
контекст:
  контур: Внутренний тестовый
  критичность: Обычная
  класс_данных: Продажи и сводка — конфиденциальные финансовые данные без персональных сведений
  пользователи: Сотрудники с ролью «Аналитик»
  профиль_обслуживания: Внутренний сервис в рабочие дни 08:00–18:00; не клиентское приложение
    24/7
  выбранный_прокси: технологический_прокси
  статус_модели: Черновик для ревью; вводные полны, согласование архитектором не моделируется
  редакция_источников: Полный Git commit hash содержащего комплект снимка; определяется из
    истории Git
  идентификация_редакции: Документ определяется путём и полным hash коммита; коммит не означает
    согласования
  контроль_качества_по_умолчанию:
    область: Все объекты и связи данного ручного эталона; явная запись объекта уточняет это
      состояние
    статус: Требует проверки
    основание: Источники и основания перечислены; трактовка и решения ещё ожидают проверки
      архитектором
    правило_смены: FR-09 (происхождение и качество); при изменении источника зависимые подтверждения
      проверяются заново
  правила:
    SEC-01: Все соединения защищены TLS; протоколы и порты заданы каталогом
    SEC-02: Проверка доступа при каждом пользовательском запросе
    SEC-03: Минимальные права; сессии и отчёты не записываются в журналы
    SEC-04: Только назначенный получатель, защищённый канал и клиентский сертификат
    SEC-05: 2FA при доступе пользователя к персональным, клиентским и иным данным
    SEC-06: Любой внешний запрос и передача данных только через корпоративный прокси
    SEC-07: Клиентское приложение 24/7 — отказоустойчивый бизнес-прокси; остальные — технологический
    SEC-08: Чувствительные внешние данные шифруются либо передаются по IPsec; финансовая сводка
      защищается TLS
    ARCH-01: Переиспользование корпоративных активов
    ARCH-02: Разделение загрузки и обслуживания запросов
    VIEW-01: 'ArchiMate: Component, Data Object, Flow, Access; System Software и направленная
      Association в техническом срезе'
  обязательность_правил: Все правила обязательны, исключений нет
профили_объектов:
  существующий_внутренний:
    состояние: Существует
    контур: Внутренний
  создаваемый_внутренний:
    состояние: Создаётся
    контур: Внутренний
профили_происхождения:
  факт_контекста:
    тип: Факт контекста
    источники: [CAT, RULES, BRD]
    статус: Задано входным контекстом
    автор: Ручной эталон
  предложение_компонента:
    тип: Предложение
    источники: [BRD, RULES, SCOPE]
    статус: Предложено; не согласовано
    автор: Ручной эталон
  факт_каталога:
    тип: Факт контекста
    источники: [CAT]
    статус: Задано входным контекстом
    автор: Ручной эталон
  факт_требований:
    тип: Факт требований
    источники: [DATA]
    автор: Ручной эталон
    статус: Задано входными требованиями
  следствие_правила:
    тип: Следствие правила
    источники: [RULES, CAT]
    автор: Ручной эталон
    статус: Предложено; не согласовано
  следствие_требований_и_контекста:
    тип: Следствие требований и контекста
    источники: [BRD, RULES, CAT]
    автор: Ручной эталон
    статус: Предложено; не согласовано
системы:
  система_продаж:
    название: Система продаж
    назначение: Публикует завершённые продажи в брокер сообщений
    тип: Система
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-01]
      фрагмент: Система продаж
  система_подразделений:
    название: Система учёта подразделений
    назначение: Предоставляет коды и наименования подразделений
    тип: Система
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-02]
      фрагмент: Система учёта подразделений
  корпоративный_доступ:
    название: Система корпоративного доступа
    назначение: Выполняет 2FA и проверяет роль и второй фактор сессии сотрудника
    тип: Система
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [N-03, SEC-02, SEC-05]
      фрагмент: Система корпоративного доступа
  брокер_сообщений:
    название: Корпоративный брокер сообщений
    назначение: Передаёт события продаж через Apache Kafka
    тип: Брокер сообщений
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-01]
      фрагмент: Корпоративный брокер сообщений
  загрузчик:
    название: Сервис загрузки данных
    назначение: Проверяет и сохраняет продажи, обновляет справочник по расписанию
    тип: Сервис
    профиль: создаваемый_внутренний
    происхождение:
      профиль: предложение_компонента
      основания: [R-01, R-02, R-03, R-06, ARCH-02, N-02]
      фрагмент: Назначение и границы; R-01, R-02, R-03, R-06, ARCH-02
    очистка: Ежедневно в 00:05 UTC удаляет продажи вне 30-дневного окна; после восстановления
      — до открытия доступа
    восстановление: Пауза при неизвестном подразделении, уведомление эксплуатации, перечитывание
      исправленного справочника и повтор Kafka без дублей; не более 4 часов
  сервис_отчетности:
    название: Сервис формирования отчётности
    назначение: Объединяет данные, подсчитывает итоги и выдаёт сводку или CSV
    тип: Сервис
    профиль: создаваемый_внутренний
    происхождение:
      профиль: предложение_компонента
      основания: [R-03, R-04, R-05, R-07, ARCH-02]
      фрагмент: Назначение и границы; R-04, R-05, R-07, ARCH-02
    диапазон_дат: Текущий день и 29 предыдущих по UTC; дата вне окна отклоняется
  база_отчетности:
    название: База данных отчётности
    назначение: Хранит данные в готовой платформе PostgreSQL
    тип: База данных
    платформа: платформа_postgresql
    профиль: создаваемый_внутренний
    происхождение:
      профиль: предложение_компонента
      основания: [R-03, ARCH-01]
      фрагмент: Назначение и границы; R-03, ARCH-01
  браузер:
    название: Браузер сотрудника
    назначение: Показывает сводку, CSV и состояние загрузки
    тип: Пользовательское приложение
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-04]
      фрагмент: браузер не обращается к источникам или БД напрямую
  платформа_postgresql:
    название: Платформа PostgreSQL
    назначение: Предоставляет инфраструктуру для создаваемой логической базы
    тип: Инфраструктурная платформа
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [ARCH-01]
      фрагмент: Платформа PostgreSQL
  передача_отчетов:
    название: Система передачи отчётов
    назначение: Передаёт CSV через технологический прокси, сохраняя сквозной TLS и клиентский
      сертификат
    тип: Система
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-07, SEC-04]
      фрагмент: Система передачи отчётов
  внешний_получатель:
    название: Внешняя система-получатель
    назначение: Принимает согласованную сводку и возвращает подтверждение
    тип: Внешняя система
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [R-07]
      фрагмент: Внешняя система-получатель
    контур: Внешний
  технологический_прокси:
    название: Технологический прокси
    назначение: Предоставляет обязательный выход из контура для внутренних приложений с рабочими
      часами
    тип: Прокси
    режим: HTTPS до прокси; метод HTTP CONNECT создаёт туннель к получателю
    защита_туннеля: Отдельный сквозной TLS до получателя; прокси не расшифровывает полезную
      нагрузку
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [N-02, SEC-06, SEC-07, SEC-08]
      фрагмент: Технологический прокси
  бизнес_прокси:
    название: Бизнес-прокси
    назначение: Предоставляет отказоустойчивый выход для клиентских приложений 24/7
    тип: Прокси
    доступность: 99,99%; два независимых узла и автоматическое переключение
    использование: Не выбран для N-02; актив вне среза текущих диаграмм
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_контекста
      основания: [SEC-07]
      фрагмент: Бизнес-прокси
  платформа_приложений:
    название: Платформа приложений
    назначение: Запускает два независимых сервиса, хранит секреты и выполняет задачу по расписанию
      в загрузчике
    тип: Инфраструктурная платформа
    использование: Среда исполнения; не участвует в передаче прикладных данных, вне среза
      диаграмм
    профиль: существующий_внутренний
    происхождение:
      профиль: факт_каталога
      фрагмент: Платформа приложений
данные:
  продажи:
    название: Данные о продажах
    описание: Неизменяемые завершённые продажи из системы продаж
    состав: [Уникальный номер продажи, Дата продажи, Код подразделения, Сумма]
    классификация: Конфиденциальные финансовые данные
    происхождение:
      профиль: факт_требований
      фрагмент: Данные о продажах
  справочник_подразделений:
    название: Справочник подразделений
    описание: Коды и названия подразделений, используемые для расшифровки продаж
    состав: [Код подразделения, Наименование подразделения]
    классификация: Внутренние служебные данные
    происхождение:
      профиль: факт_требований
      фрагмент: Справочник подразделений
  отчетные_данные:
    название: Данные отчётности
    описание: Продажи, справочник и состояние загрузки, сохранённые в БД
    хранение: база_отчетности
    срок_хранения_продаж: 30 календарных дней, включая текущий, по UTC; очистка по R-03
    классификация: Конфиденциальные финансовые данные
    происхождение:
      профиль: факт_требований
      фрагмент: Данные отчётности
      основания: [R-03]
    резервные_копии: 7 суток только для восстановления; устаревшие продажи удаляются до открытия
      восстановленной БД
  сводный_отчет:
    название: Сводный отчёт
    описание: Количество продаж и общая сумма по подразделениям за выбранный день
    состав: [Дата, Подразделение, Количество продаж, Сумма]
    хранение: Не сохраняется
    классификация: Конфиденциальные финансовые данные
    происхождение:
      профиль: факт_требований
      фрагмент: Сводный отчёт
  состояние_загрузки:
    название: Состояние загрузки
    описание: Состояние обработчика и время последней успешной обработки
    хранение: база_отчетности
    классификация: Внутренние служебные данные
    происхождение:
      профиль: факт_требований
      фрагмент: Состояние загрузки
  права_доступа:
    название: Результат проверки доступа
    описание: Разрешение на запрос, подтверждённая роль сотрудника и признак выполнения 2FA
    хранение: Не сохраняется
    классификация: Внутренние служебные данные
    происхождение:
      профиль: факт_требований
      фрагмент: Результат проверки доступа
  подтверждение_передачи:
    название: Подтверждение передачи
    описание: Результат приёма внешним получателем и номер подтверждения
    хранение: Не сохраняется
    классификация: Внутренние служебные данные
    происхождение:
      профиль: факт_требований
      фрагмент: Подтверждение передачи
  контекст_входа:
    название: Контекст двухфакторного входа
    описание: Запрос входа на существующей корпоративной странице; секреты в модель не включаются
    хранение: Не сохраняется
    классификация: Чувствительные данные аутентификации
    происхождение:
      профиль: следствие_правила
      фрагмент: SEC-05; Система корпоративного доступа
  сессия_2fa:
    название: Подтверждение двухфакторной сессии
    описание: Результат 2FA для браузера; при доступе повторно проверяется корпоративной системой
    хранение: Не сохраняется
    классификация: Чувствительные данные аутентификации
    происхождение:
      профиль: следствие_правила
      фрагмент: SEC-05; Система корпоративного доступа
потоки:
  публикация_продаж:
    откуда: система_продаж
    куда: брокер_сообщений
    данные: [продажи]
    когда: После завершения продажи
    взаимодействие: публикация_в_брокер
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-01]
  получение_продаж:
    откуда: брокер_сообщений
    куда: загрузчик
    данные: [продажи]
    когда: В течение дня
    взаимодействие: чтение_из_брокера
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-01, R-06]
  получение_справочника:
    откуда: система_подразделений
    куда: загрузчик
    данные: [справочник_подразделений]
    когда: При запуске и ежедневно в 06:00
    взаимодействие: запрос_справочника
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-02]
  сохранение_данных:
    откуда: загрузчик
    куда: отчетные_данные
    данные: [отчетные_данные]
    когда: После проверки входных данных
    взаимодействие: запись_в_базу
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-03, R-06]
  чтение_данных:
    откуда: отчетные_данные
    куда: сервис_отчетности
    данные: [отчетные_данные]
    когда: При пользовательском запросе
    взаимодействие: чтение_базы
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-04, R-05, R-06]
  проверка_доступа:
    откуда: корпоративный_доступ
    куда: сервис_отчетности
    данные: [права_доступа]
    когда: При каждом пользовательском запросе
    взаимодействие: запрос_прав
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [N-03, SEC-02, SEC-05]
  выдача_сводки:
    откуда: сервис_отчетности
    куда: браузер
    данные: [сводный_отчет, состояние_загрузки, подтверждение_передачи]
    когда: После проверки доступа
    взаимодействие: пользовательский_запрос
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-04, R-05, R-06, R-07]
  передача_отчета:
    откуда: сервис_отчетности
    куда: передача_отчетов
    данные: [сводный_отчет]
    когда: По команде аналитика
    взаимодействие: защищенная_передача
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-07, SEC-04]
  передача_в_прокси:
    откуда: передача_отчетов
    куда: технологический_прокси
    данные: [сводный_отчет]
    когда: После проверки разрешённого получателя
    взаимодействие: туннель_через_прокси
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-07, SEC-06, SEC-07, SEC-08]
  доставка_получателю:
    откуда: технологический_прокси
    куда: внешний_получатель
    данные: [сводный_отчет]
    когда: В защищённом туннеле системы передачи отчётов
    взаимодействие: доставка_отчета
    происхождение:
      профиль: следствие_требований_и_контекста
      основания: [R-07, SEC-06, SEC-08]
  внешнее_подтверждение:
    откуда: внешний_получатель
    куда: технологический_прокси
    данные: [подтверждение_передачи]
    когда: Ответ на передачу по тому же защищённому обращению
    взаимодействие: доставка_отчета
