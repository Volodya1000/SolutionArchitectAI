name: Application quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.9
          python-version: 3.13.9
      - name: Install locked dependencies
        run: |
          uv sync --locked --project backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Install pinned repository tools
        run: uv run --locked --project backend python -m tools.install_quality_tools
      - name: Full local and CI quality gates
        run: uv run --locked --project backend python -m tools.quality full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: application-failure
          path: |
            .build/quality/**/compose.log
            frontend/playwright-report/
            frontend/test-results/
            .build/frontend-coverage/
            .build/backend-coverage.*
