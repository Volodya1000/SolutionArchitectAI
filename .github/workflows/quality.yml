name: Application quality
on:
  pull_request:
  push:
    branches: [main, feat/pr1-working-chat]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SAA_MODE: test
      SAA_DATABASE__HOST: 127.0.0.1
      SAA_DATABASE__PORT: '5433'
      SAA_DATABASE__DATABASE: solution_architect_test
      SAA_LLM__BASE_URL: http://127.0.0.1:8001/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.9
          python-version: 3.13.9
      - name: Install locked dependencies
        run: |
          uv sync --locked --project backend
          pnpm --dir frontend install --frozen-lockfile
      - name: Backend static gates
        working-directory: backend
        run: |
          uv run --locked ruff check src tests
          uv run --locked ruff format --check src tests
          uv run --locked mypy src
          uv run --locked pylint src
          uv run --locked bandit -c pyproject.toml -r src -q
          uv run --locked lint-imports .importlinter
          uv run --locked flake8 src
      - name: Frontend gates
        working-directory: frontend
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          node scripts/check-contracts.mjs
          pnpm test
          pnpm build
          pnpm audit --audit-level low
      - name: Repository gates
        run: |
          uv run --project backend python tools/check_links.py
          uv run --project backend python tools/install_quality_tools.py
          .build/quality-tools/actionlint/actionlint
          uv run --project backend yamllint .
          node frontend/node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
          .build/quality-tools/typos/typos
          uv export --project backend --frozen --no-emit-project --format requirements-txt --output-file .build/backend-requirements.txt
          uvx pip-audit==2.10.1 --require-hashes --no-deps --disable-pip -r .build/backend-requirements.txt
      - name: Start clean Compose with fake LLM
        run: |
          docker compose config --quiet
          SAA_LLM__BASE_URL=http://fake-llm:8000/v1 SAA_LLM__MODEL=fake-chat docker compose up -d --build --wait
          docker compose exec -T postgres createdb -U solution_architect solution_architect_test
      - name: PostgreSQL integration and lifecycle tests
        working-directory: backend
        run: |
          uv run --locked python -m solution_architect_ai.di.migrate
          uv run --locked pytest --disable-socket --allow-hosts=127.0.0.1,localhost --allow-unix-socket
      - name: Browser acceptance
        working-directory: frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Restart and failure smoke
        env:
          SAA_LLM__BASE_URL: http://fake-llm:8000/v1
          SAA_LLM__MODEL: fake-chat
        run: uv run --project backend python tools/runtime_smoke.py
      - name: Container diagnostics
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: application-failure
          path: |
            compose.log
            frontend/playwright-report/
            frontend/test-results/
      - name: Stop test environment
        if: always()
        run: docker compose down
