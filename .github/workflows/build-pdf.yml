name: Build document PDFs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install example format validator
        run: python3 -m pip install -r scripts/requirements-docs.txt

      - name: Validate documentary architecture example
        run: python3 scripts/validate_example.py

      - name: Install document tools and Cyrillic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended fonts-dejavu inkscape pandoc poppler-utils

      - name: Check example and publisher regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Compile editable LaTeX until TOC and references converge
        run: python3 scripts/build_documents.py --output-dir .build/document-artifacts

      - name: Ensure ordinary build preserves LaTeX sources
        run: git diff --exit-code -- docs/latex

      - name: Upload all five PDFs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-documents
          path: |
            .build/document-artifacts/brd.pdf
            .build/document-artifacts/example.pdf
            .build/document-artifacts/technical-decisions.pdf
            .build/document-artifacts/brd-input-guidelines.pdf
            .build/document-artifacts/brd-template.pdf
          if-no-files-found: error
