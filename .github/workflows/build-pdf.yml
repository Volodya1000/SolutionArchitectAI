name: Build document PDFs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/**'
      - 'scripts/build_documents.py'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: document-pdf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install document tools and Cyrillic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-lang-cyrillic texlive-fonts-recommended fonts-dejavu inkscape

      - name: Compile editable LaTeX twice
        run: python3 scripts/build_documents.py

      - name: Upload both PDFs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-documents
          path: |
            docs/pdf/brd.pdf
            docs/pdf/example.pdf
          if-no-files-found: error

      - name: Commit PDFs to a same-repository feature PR branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != github.event.repository.default_branch &&
          github.event.pull_request.head.ref != github.event.pull_request.base.ref &&
          github.event.pull_request.head.ref != 'main' &&
          github.event.pull_request.head.ref != 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          # Defense in depth: a manual run or a base/default branch is never written.
          test -n "$HEAD_BRANCH"
          test "$HEAD_BRANCH" != "$DEFAULT_BRANCH"
          test "$HEAD_BRANCH" != "$BASE_BRANCH"
          test "$HEAD_BRANCH" != main
          test "$HEAD_BRANCH" != master
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git add -- docs/pdf/brd.pdf docs/pdf/example.pdf
          if git diff --cached --quiet; then
            echo 'The committed PDFs are current.'
            exit 0
          fi
          remote_head=$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)
          if test "$remote_head" != "$EXPECTED_HEAD"; then
            echo 'The PR branch changed during the build; leave the newer revision untouched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh document PDFs'
          # An exact lease prevents overwriting a concurrent push after the check above.
          gh auth setup-git
          git push --force-with-lease="refs/heads/$HEAD_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$HEAD_BRANCH"
