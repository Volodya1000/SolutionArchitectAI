minimum_pre_commit_version: '4.7.0'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: application-fast
        name: Static checks and fast unit tests
        entry: uv run --locked --project backend python -m tools.quality fast
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
      - id: application-full
        name: Full CI-equivalent checks with isolated runtime
        entry: uv run --locked --project backend python -m tools.quality full
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
