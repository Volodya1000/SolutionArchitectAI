llm:
  context_window: 12288
  output_limit: 6912
  structured_mode: native_json_schema
  service_tokens: 256
  concurrency: 1
  temperature: 0.2
  approximate_chars_per_token: 2.0
  retry:
    network_retries: 1
    validation_retries: 2
    max_total_requests: 128
    deadline_seconds: 1800
    request_timeout_seconds: 600
